<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ZÁKLADNÍ STYLY */
        body {
            background-color: black; color: #ff0000; font-family: Arial, sans-serif;
            margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }
        .digital-font { font-family: 'Share Tech Mono', monospace; }
        .view {
            display: none; width: 100%; height: 100%; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }
        .active-view { display: flex; }

        /* --- HLAVNÍ MENU --- */
        #menu-clock { font-size: 8rem; margin-bottom: 50px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.7); text-align: center; }
        .menu-buttons { display: flex; gap: 20px; }
        .menu-btn {
            background: transparent; border: 4px solid #ff0000; color: #ff0000;
            width: 200px; height: 200px; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,0,0,0.3), inset 0 0 15px rgba(255,0,0,0.3);
            transition: all 0.2s ease;
        }
        .menu-btn:hover { background-color: rgba(255, 0, 0, 0.1); transform: scale(1.05); }

        /* --- SPOLEČNÉ HERNÍ STYLY --- */
        .top-bar {
            position: absolute; top: 20px; width: 100%; display: flex;
            justify-content: space-between; padding: 0 40px; box-sizing: border-box; z-index: 10;
        }
        .circle-icon, .text-icon {
            border: 2px solid #ff0000; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background-color 0.2s; background: black;
        }
        .circle-icon { width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; }
        .text-icon { height: 50px; padding: 0 20px; border-radius: 25px; font-size: 1.2rem; font-weight: bold; }
        .circle-icon:hover, .text-icon:hover { background-color: rgba(255, 0, 0, 0.2); }
        
        h1 { font-size: 4rem; margin: 20px 0 0 0; position: absolute; top: 20px; text-align: center; }
        .subtitle { font-size: 2rem; margin-bottom: 20px; color: #fff; text-align: center; }
        .game-center { display: flex; flex-direction: column; align-items: center; margin-right: 300px; }
        .target-time { color: #00ff00; font-size: 2.5rem; margin-bottom: 20px; text-align: center; }
        .main-timer { font-size: 8rem; margin-bottom: 20px; height: 150px; display: flex; align-items: center; justify-content: center; }
        .hide-timer { visibility: hidden; }
        
        .action-btn {
            background-color: #00aa00; color: black; border: none; border-radius: 25px;
            padding: 15px 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer;
            margin-bottom: 10px; text-transform: uppercase; text-align: center;
        }
        .action-btn.stop-mode { background-color: #ff0000; color: white; }
        .spacebar-hint { font-size: 1.2rem; margin-top: 10px; text-align: center; }
        .result-msg { margin-top: 20px; font-size: 1.5rem; height: 30px; text-align: center; }

        /* --- PRAVÝ PANEL --- */
        .right-panel {
            position: absolute; right: 40px; top: 100px; width: 250px; border: 2px solid #ff0000;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
            max-height: 80vh; overflow-y: auto; background-color: rgba(0,0,0,0.8);
        }
        .panel-section { margin-bottom: 20px; width: 100%; text-align: center; }
        .right-panel input {
            background: transparent; border: 1px solid #ff0000; color: #ff0000; text-align: center;
            padding: 5px; margin-top: 5px; width: 80%; font-family: inherit;
        }
        .players-list-container { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
        .results-list { text-align: left; width: 100%; font-size: 0.9rem; line-height: 1.5; }
        .results-list div { display: flex; justify-content: space-between; }

        /* --- OVERLAYS (MODALS & FULLSCREEN) --- */
        #rules-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.95); border: 2px solid #ff0000; padding: 40px;
            width: 500px; text-align: center; z-index: 100; box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
        #rules-modal h2 { margin-top: 0; font-size: 2rem; }
        #rules-modal p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; }
        .close-btn {
            background-color: transparent; color: #ff0000; border: 2px solid #ff0000;
            padding: 10px 30px; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; transition: all 0.2s;
        }
        .close-btn:hover { background-color: #ff0000; color: black; }
        
        .fullscreen-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); z-index: 80; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .fullscreen-overlay h2 { font-size: 4rem; margin: 0 0 20px 0; color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        .fullscreen-overlay.winner h2 { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        .overlay-hint { color: white; font-size: 1.5rem; margin-bottom: 30px; line-height: 1.5; }
        
        /* Impostor Vote Buttons */
        #imp-vote-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .imp-vote-btn {
            background: transparent; border: 2px solid #ff0000; color: #ff0000;
            padding: 15px; font-size: 2rem; cursor: pointer; text-transform: uppercase
